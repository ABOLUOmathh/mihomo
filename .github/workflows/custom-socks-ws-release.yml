name: Custom Mihomo Versioned Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release tag, e.g. v1.19.30-custom.4"
        required: true
        type: string

      source_ref:
        description: "Custom source branch or commit to release"
        required: true
        default: "release/v1.19.30-custom.4"
        type: string

permissions:
  contents: read

concurrency:
  group: custom-mihomo-versioned-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}
      base_tag: ${{ steps.meta.outputs.base_tag }}
      source_sha: ${{ steps.meta.outputs.source_sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Validate version and upstream base
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom\.[1-9][0-9]*$ ]]; then
            echo "Invalid version: ${VERSION}"
            echo "Expected format: vX.Y.Z-custom.N"
            exit 1
          fi

          BASE_TAG="${VERSION%-custom.*}"
          SOURCE_SHA="$(git rev-parse HEAD)"

          echo "Release version: ${VERSION}"
          echo "Requested source ref: ${{ inputs.source_ref }}"
          echo "Resolved source commit: ${SOURCE_SHA}"
          echo "Expected upstream base: ${BASE_TAG}"

          git fetch --force \
            https://github.com/MetaCubeX/mihomo.git \
            "refs/tags/${BASE_TAG}:refs/tags/${BASE_TAG}" \
            "refs/heads/Meta:refs/remotes/release-upstream/Meta"

          BASE_SHA="$(git rev-parse "${BASE_TAG}^{commit}")"
          UPSTREAM_META_SHA="$(git rev-parse refs/remotes/release-upstream/Meta)"
          MERGE_BASE="$(git merge-base "${SOURCE_SHA}" "${UPSTREAM_META_SHA}")"

          if [[ "${MERGE_BASE}" != "${BASE_SHA}" ]]; then
            echo "Custom source does not have the exact expected upstream base."
            echo "Expected base tag: ${BASE_TAG}"
            echo "Expected base SHA: ${BASE_SHA}"
            echo "Actual upstream merge-base: ${MERGE_BASE}"
            exit 1
          fi

          if git ls-remote \
            --exit-code \
            --tags \
            origin \
            "refs/tags/${VERSION}" \
            >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists."
            echo "Versioned custom releases are immutable."
            exit 1
          fi

          if gh release view \
            "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists."
            echo "Versioned custom releases are immutable."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "base_tag=${BASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"

  test:
    name: Release gate tests
    needs: validate
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      SKIP_CONCURRENT_TEST: "1"
      SKIP_INTEROP_TEST: "1"

    steps:
      - name: Checkout validated source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"

      - name: Run custom protocol regression tests
        run: |
          go test ./adapter/outbound \
            -run '^TestSocks5' \
            -v \
            -count=1

          go test ./adapter/outbound \
            -run '^TestHeySocks.*UOT' \
            -v \
            -count=1

          go test ./transport/shadowsocks/heysocks2022 \
            -v \
            -count=1

          go test ./common/convert \
            -run '^TestConvertsV2Ray(BlackstoneFullBase64UOT|SSFullBase64Regression)$' \
            -v \
            -count=1

          go test ./transport/heysocks/xhttp \
            -v \
            -count=1

          go test ./adapter/outbound \
            -run '^TestHeySocksXHTTP' \
            -v \
            -count=1

          go test ./adapter \
            -run 'HeySocks|XHTTP|Xhttp' \
            -v \
            -count=1

      - name: Run XHTTP race tests
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race ./transport/heysocks/xhttp \
            -count=1

          go test -race ./adapter/outbound \
            -run '^TestHeySocksXHTTP' \
            -count=1

      - name: Run full test suite
        run: |
          go test ./... \
            -count=1

      - name: Run full test suite with gVisor
        run: |
          go test ./... \
            -count=1 \
            -tags "with_gvisor"

  build:
    name: Build ${{ matrix.asset }}
    needs:
      - validate
      - test

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { goos: linux, goarch: "386", go386: sse2, asset: mihomo-linux-386, ext: gz }
          - { goos: linux, goarch: "386", go386: softfloat, asset: mihomo-linux-386-softfloat, ext: gz }

          - { goos: linux, goarch: amd64, goamd64: v1, asset: mihomo-linux-amd64-compatible, ext: gz }
          - { goos: linux, goarch: amd64, goamd64: v3, asset: mihomo-linux-amd64, ext: gz }
          - { goos: linux, goarch: amd64, goamd64: v1, asset: mihomo-linux-amd64-v1, ext: gz }
          - { goos: linux, goarch: amd64, goamd64: v2, asset: mihomo-linux-amd64-v2, ext: gz }
          - { goos: linux, goarch: amd64, goamd64: v3, asset: mihomo-linux-amd64-v3, ext: gz }

          - { goos: linux, goarch: arm64, asset: mihomo-linux-arm64, ext: gz }
          - { goos: linux, goarch: arm, goarm: "5", asset: mihomo-linux-armv5, ext: gz }
          - { goos: linux, goarch: arm, goarm: "6", asset: mihomo-linux-armv6, ext: gz }
          - { goos: linux, goarch: arm, goarm: "7", asset: mihomo-linux-armv7, ext: gz }

          - { goos: linux, goarch: mips, gomips: hardfloat, asset: mihomo-linux-mips-hardfloat, ext: gz }
          - { goos: linux, goarch: mips, gomips: softfloat, asset: mihomo-linux-mips-softfloat, ext: gz }
          - { goos: linux, goarch: mipsle, gomips: hardfloat, asset: mihomo-linux-mipsle-hardfloat, ext: gz }
          - { goos: linux, goarch: mipsle, gomips: softfloat, asset: mihomo-linux-mipsle-softfloat, ext: gz }
          - { goos: linux, goarch: mips64, asset: mihomo-linux-mips64, ext: gz }
          - { goos: linux, goarch: mips64le, asset: mihomo-linux-mips64le, ext: gz }

          - { goos: linux, goarch: loong64, asset: mihomo-linux-loong64-abi2, ext: gz }
          - { goos: linux, goarch: riscv64, asset: mihomo-linux-riscv64, ext: gz }
          - { goos: linux, goarch: s390x, asset: mihomo-linux-s390x, ext: gz }
          - { goos: linux, goarch: ppc64le, asset: mihomo-linux-ppc64le, ext: gz }

          # macOS
          - { goos: darwin, goarch: amd64, goamd64: v1, asset: mihomo-darwin-amd64-compatible, ext: gz }
          - { goos: darwin, goarch: amd64, goamd64: v3, asset: mihomo-darwin-amd64, ext: gz }
          - { goos: darwin, goarch: amd64, goamd64: v1, asset: mihomo-darwin-amd64-v1, ext: gz }
          - { goos: darwin, goarch: amd64, goamd64: v2, asset: mihomo-darwin-amd64-v2, ext: gz }
          - { goos: darwin, goarch: amd64, goamd64: v3, asset: mihomo-darwin-amd64-v3, ext: gz }
          - { goos: darwin, goarch: arm64, asset: mihomo-darwin-arm64, ext: gz }

          # Windows
          - { goos: windows, goarch: "386", asset: mihomo-windows-386, ext: zip }
          - { goos: windows, goarch: amd64, goamd64: v1, asset: mihomo-windows-amd64-compatible, ext: zip }
          - { goos: windows, goarch: amd64, goamd64: v3, asset: mihomo-windows-amd64, ext: zip }
          - { goos: windows, goarch: amd64, goamd64: v1, asset: mihomo-windows-amd64-v1, ext: zip }
          - { goos: windows, goarch: amd64, goamd64: v2, asset: mihomo-windows-amd64-v2, ext: zip }
          - { goos: windows, goarch: amd64, goamd64: v3, asset: mihomo-windows-amd64-v3, ext: zip }
          - { goos: windows, goarch: arm64, asset: mihomo-windows-arm64, ext: zip }

          # FreeBSD
          - { goos: freebsd, goarch: "386", asset: mihomo-freebsd-386, ext: gz }
          - { goos: freebsd, goarch: amd64, goamd64: v1, asset: mihomo-freebsd-amd64-compatible, ext: gz }
          - { goos: freebsd, goarch: amd64, goamd64: v3, asset: mihomo-freebsd-amd64, ext: gz }
          - { goos: freebsd, goarch: amd64, goamd64: v1, asset: mihomo-freebsd-amd64-v1, ext: gz }
          - { goos: freebsd, goarch: amd64, goamd64: v2, asset: mihomo-freebsd-amd64-v2, ext: gz }
          - { goos: freebsd, goarch: amd64, goamd64: v3, asset: mihomo-freebsd-amd64-v3, ext: gz }
          - { goos: freebsd, goarch: arm64, asset: mihomo-freebsd-arm64, ext: gz }

          # Android
          - { goos: android, goarch: "386", ndk: i686-linux-android34, asset: mihomo-android-386, ext: gz }
          - { goos: android, goarch: amd64, ndk: x86_64-linux-android34, asset: mihomo-android-amd64, ext: gz }
          - { goos: android, goarch: arm, goarm: "7", ndk: armv7a-linux-androideabi34, asset: mihomo-android-armv7, ext: gz }
          - { goos: android, goarch: arm64, ndk: aarch64-linux-android34, asset: mihomo-android-arm64-v8, ext: gz }

    steps:
      - name: Checkout validated source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"

      - name: Set default build environment
        shell: bash
        run: |
          echo "CGO_ENABLED=0" >> "${GITHUB_ENV}"
          echo "BUILDTAG=-extldflags --static" >> "${GITHUB_ENV}"

      - name: Setup Android NDK
        if: ${{ matrix.goos == 'android' }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1

      - name: Set Android build environment
        if: ${{ matrix.goos == 'android' }}
        shell: bash
        run: |
          echo "CC=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.ndk }}-clang" >> "${GITHUB_ENV}"
          echo "CGO_ENABLED=1" >> "${GITHUB_ENV}"
          echo "BUILDTAG=" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GO386: ${{ matrix.go386 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail

          RELEASE_VERSION="${{ needs.validate.outputs.version }}"
          BINARY_VERSION="${RELEASE_VERSION#v}"
          BUILDTIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          BINARY="${{ matrix.asset }}"

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            BINARY="${BINARY}.exe"
          fi

          go build \
            -v \
            -tags "with_gvisor" \
            -trimpath \
            -ldflags "${BUILDTAG} -X 'github.com/metacubex/mihomo/constant.Version=${BINARY_VERSION}' -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' -w -s -buildid=" \
            -o "${BINARY}" \
            .

          test -s "${BINARY}"

          mkdir -p release

          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            zip -j \
              "release/${{ matrix.asset }}-${RELEASE_VERSION}.zip" \
              "${BINARY}"
          else
            gzip -c \
              "${BINARY}" \
              > "release/${{ matrix.asset }}-${RELEASE_VERSION}.gz"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: release/*
          if-no-files-found: error

  audit:
    name: Audit release artifacts
    needs:
      - validate
      - test
      - build

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Verify assets and calculate checksums
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION="${{ needs.validate.outputs.version }}"
          EXPECTED_ASSET_COUNT=45

          mapfile -t assets < <(
            find release \
              -maxdepth 1 \
              -type f \
              \( \
                -name "mihomo-*-${RELEASE_VERSION}.gz" \
                -o \
                -name "mihomo-*-${RELEASE_VERSION}.zip" \
              \) \
              -printf '%f\n' \
              | sort
          )

          if (( ${#assets[@]} != EXPECTED_ASSET_COUNT )); then
            echo "Unexpected release asset count."
            echo "Expected: ${EXPECTED_ASSET_COUNT}"
            echo "Actual:   ${#assets[@]}"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi

          mapfile -t all_files < <(
            find release \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
          )

          if (( ${#all_files[@]} != ${#assets[@]} )); then
            echo "Unexpected non-release files found."
            printf 'All files:\n'
            printf '%s\n' "${all_files[@]}"
            exit 1
          fi

          mandatory=(
            "mihomo-linux-amd64-compatible-${RELEASE_VERSION}.gz"
            "mihomo-linux-arm64-${RELEASE_VERSION}.gz"
            "mihomo-windows-amd64-compatible-${RELEASE_VERSION}.zip"
            "mihomo-darwin-arm64-${RELEASE_VERSION}.gz"
            "mihomo-android-386-${RELEASE_VERSION}.gz"
            "mihomo-android-amd64-${RELEASE_VERSION}.gz"
            "mihomo-android-armv7-${RELEASE_VERSION}.gz"
            "mihomo-android-arm64-v8-${RELEASE_VERSION}.gz"
          )

          for file in "${mandatory[@]}"; do
            if [[ ! -f "release/${file}" ]]; then
              echo "Missing mandatory release asset: ${file}"
              exit 1
            fi
          done

          (
            cd release
            sha256sum "${assets[@]}" > checksums.txt
          )

          echo "Release asset count: ${#assets[@]}"
          ls -lh release
          cat release/checksums.txt


      - name: Upload verified release bundle
        uses: actions/upload-artifact@v7
        with:
          name: custom-release-bundle
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish immutable custom release
    needs:
      - validate
      - audit

    environment:
      name: custom-release

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v8
        with:
          name: custom-release-bundle
          path: release

      - name: Verify promoted release bundle
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_VERSION="${{ needs.validate.outputs.version }}"
          EXPECTED_ASSET_COUNT=45
          EXPECTED_TOTAL_FILE_COUNT=46

          test -f release/checksums.txt

          mapfile -t assets < <(
            find release \
              -maxdepth 1 \
              -type f \
              \( \
                -name "mihomo-*-${RELEASE_VERSION}.gz" \
                -o \
                -name "mihomo-*-${RELEASE_VERSION}.zip" \
              \) \
              -printf '%f\n' \
              | sort
          )

          mapfile -t all_files < <(
            find release \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
          )

          if (( ${#assets[@]} != EXPECTED_ASSET_COUNT )); then
            echo "PROMOTION_ASSET_COUNT_AUDIT=FAIL"
            echo "Expected: ${EXPECTED_ASSET_COUNT}"
            echo "Actual:   ${#assets[@]}"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi

          if (( ${#all_files[@]} != EXPECTED_TOTAL_FILE_COUNT )); then
            echo "PROMOTION_TOTAL_FILE_COUNT_AUDIT=FAIL"
            echo "Expected: ${EXPECTED_TOTAL_FILE_COUNT}"
            echo "Actual:   ${#all_files[@]}"
            printf '%s\n' "${all_files[@]}"
            exit 1
          fi

          (
            cd release
            sha256sum -c checksums.txt
          )

          echo "PROMOTION_ASSET_COUNT_AUDIT=PASS"
          echo "PROMOTION_CHECKSUM_AUDIT=PASS"

      - name: Recheck release immutability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="${{ needs.validate.outputs.version }}"

          if gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" \
            >/dev/null 2>&1; then
            echo "Tag ${VERSION} appeared after validation."
            echo "Refusing to overwrite an existing version."
            exit 1
          fi

          if gh release view \
            "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            >/dev/null 2>&1; then
            echo "Release ${VERSION} appeared after validation."
            echo "Refusing to overwrite an existing version."
            exit 1
          fi

      - name: Publish versioned prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="${{ needs.validate.outputs.version }}"
          BASE_TAG="${{ needs.validate.outputs.base_tag }}"

          cat > release-notes.md <<EOF_NOTES
          Custom Mihomo build based on ${BASE_TAG}.

          Custom version: ${VERSION}
          Source commit: ${{ needs.validate.outputs.source_sha }}

          Custom features:
          - SOCKS5-over-WebSocket transport support
          - SOCKS5-over-WebSocket TLS, Host header, and authentication support
          - HeySocks / BLACKSTONE Shadowsocks 2022 compatibility
          - BLACKSTONE automatic #BLACKSTONE password marker detection
          - BLACKSTONE UDP-over-TCP using UOT legacy version 1
          - HeySocks full-base64 ss:// share-link import with ?uot=1 support
          - HeySocks proprietary XHTTP outbound support
          - HeySocks XHTTP TCP support
          - HeySocks XHTTP native UDP support
          - HeySocks XHTTP UOT v0/v1/v2 compatibility
          - Multi-platform core artifacts for Linux, Windows, macOS, FreeBSD, and Android
          - Android 386, amd64, armv7, and arm64-v8 core artifacts

          Compatibility notes:
          - Standard Shadowsocks behavior remains available for non-BLACKSTONE nodes.
          - BLACKSTONE Shadowsocks 2022 native UDP is not implemented; it uses UOT over TCP.
          - HeySocks XHTTP e=true is accepted and verified with a real native-compatible node.
          - HeySocks XHTTP non-empty h remains fail-closed until native behavior is established.
          - Existing v1.19.30-custom.1 remains immutable and is not replaced.
          - Existing v1.19.30-custom.2 remains immutable and is not replaced.
          - Existing v1.19.30-custom.3 remains immutable and is not replaced.

          This release is immutable. Existing versioned tags and releases are never overwritten.
          EOF_NOTES

          gh release create \
            "${VERSION}" \
            release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${{ needs.validate.outputs.source_sha }}" \
            --title "Mihomo ${VERSION}" \
            --prerelease \
            --notes-file release-notes.md
