name: Custom Mihomo Compatibility CI

on:
  workflow_dispatch:

  push:
    branches:
      - feat/heysocks-sharelink
      - chore/custom-2-release-prep
      - chore/custom-3-release-prep
      - "sync/mihomo-*"
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/custom-socks-ws-ci.yml"
      - ".github/workflows/custom-socks-ws-release.yml"

  pull_request:
    branches:
      - feat/heysocks-sharelink
      - chore/custom-2-release-prep
      - chore/custom-3-release-prep
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/custom-socks-ws-ci.yml"
      - ".github/workflows/custom-socks-ws-release.yml"

permissions:
  contents: read

concurrency:
  group: custom-mihomo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Custom compatibility tests
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      SKIP_CONCURRENT_TEST: "1"
      SKIP_INTEROP_TEST: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"

      - name: Verify Go
        run: |
          go version
          go env

      - name: Run custom protocol regression tests
        run: |
          go test ./adapter/outbound \
            -run '^TestSocks5' \
            -v \
            -count=1

          go test ./adapter/outbound \
            -run '^TestHeySocks.*UOT' \
            -v \
            -count=1

          go test ./transport/shadowsocks/heysocks2022 \
            -v \
            -count=1

          go test ./common/convert \
            -run '^TestConvertsV2Ray(BlackstoneFullBase64UOT|SSFullBase64Regression)$' \
            -v \
            -count=1

          go test ./transport/heysocks/xhttp \
            -v \
            -count=1

          go test ./adapter/outbound \
            -run '^TestHeySocksXHTTP' \
            -v \
            -count=1

          go test ./adapter \
            -run 'HeySocks|XHTTP|Xhttp' \
            -v \
            -count=1

      - name: Run XHTTP race tests
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race ./transport/heysocks/xhttp \
            -count=1

          go test -race ./adapter/outbound \
            -run '^TestHeySocksXHTTP' \
            -count=1

      - name: Run full test suite
        run: |
          go test ./... \
            -count=1

      - name: Run full test suite with gVisor
        run: |
          go test ./... \
            -count=1 \
            -tags "with_gvisor"

  cross-build-smoke:
    name: Cross build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-386-softfloat
            goos: linux
            goarch: "386"
            go386: softfloat

          - name: linux-arm64
            goos: linux
            goarch: arm64

          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"

          - name: linux-mipsle-softfloat
            goos: linux
            goarch: mipsle
            gomips: softfloat

          - name: windows-amd64-v1
            goos: windows
            goarch: amd64
            goamd64: v1

          - name: darwin-arm64
            goos: darwin
            goarch: arm64

          - name: freebsd-amd64-v1
            goos: freebsd
            goarch: amd64
            goamd64: v1

          - name: android-amd64
            goos: android
            goarch: amd64
            ndk: x86_64-linux-android34

          - name: android-arm64-v8
            goos: android
            goarch: arm64
            ndk: aarch64-linux-android34

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"

      - name: Set default build environment
        shell: bash
        run: |
          echo "CGO_ENABLED=0" >> "${GITHUB_ENV}"
          echo "BUILDTAG=-extldflags --static" >> "${GITHUB_ENV}"

      - name: Setup Android NDK
        if: ${{ matrix.goos == 'android' }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1

      - name: Set Android build environment
        if: ${{ matrix.goos == 'android' }}
        shell: bash
        run: |
          echo "CC=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.ndk }}-clang" >> "${GITHUB_ENV}"
          echo "CGO_ENABLED=1" >> "${GITHUB_ENV}"
          echo "BUILDTAG=" >> "${GITHUB_ENV}"

      - name: Cross build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GO386: ${{ matrix.go386 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail

          OUTPUT="/tmp/mihomo-${{ matrix.name }}"

          go build \
            -v \
            -tags "with_gvisor" \
            -trimpath \
            -ldflags "${BUILDTAG} -w -s -buildid=" \
            -o "${OUTPUT}" \
            .

          test -s "${OUTPUT}"

          stat -c \
            'CROSS_BUILD_BYTES=%s' \
            "${OUTPUT}"
