name: Custom Mihomo Compatibility CI

on:
  workflow_dispatch:

  push:
    branches:
      - feat/heysocks-sharelink
      - chore/custom-2-release-prep
      - "sync/mihomo-*"
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/custom-socks-ws-ci.yml"
      - ".github/workflows/custom-socks-ws-release.yml"

  pull_request:
    branches:
      - feat/heysocks-sharelink
      - chore/custom-2-release-prep
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/custom-socks-ws-ci.yml"
      - ".github/workflows/custom-socks-ws-release.yml"

permissions:
  contents: read

concurrency:
  group: custom-mihomo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Custom compatibility tests
    runs-on: ubuntu-latest

    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      SKIP_CONCURRENT_TEST: "1"
      SKIP_INTEROP_TEST: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"

      - name: Verify Go
        run: |
          go version
          go env

      - name: Run custom protocol regression tests
        run: |
          go test ./adapter/outbound \
            -run '^TestSocks5' \
            -v \
            -count=1

          go test ./adapter/outbound \
            -run '^TestHeySocks.*UOT' \
            -v \
            -count=1

          go test ./transport/shadowsocks/heysocks2022 \
            -v \
            -count=1

          go test ./common/convert \
            -run '^TestConvertsV2Ray(BlackstoneFullBase64UOT|SSFullBase64Regression)$' \
            -v \
            -count=1

      - name: Run full test suite
        run: |
          go test ./... \
            -count=1

      - name: Run full test suite with gVisor
        run: |
          go test ./... \
            -count=1 \
            -tags "with_gvisor"
